<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Kalka — reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; background: #ECEAE4; }
  #frame { position: relative; width: 1440px; height: 1440px; overflow: hidden; background: #ECEAE4; font-family: Geist, sans-serif; color: #111110; -webkit-font-smoothing: antialiased; }
  #cam { position: absolute; left: 720px; top: 720px; width: 0; height: 0; }
  #shape { position: absolute; overflow: hidden; }
  .layer { position: absolute; left: 50%; top: 50%; display: flex; align-items: center; justify-content: center; }
  .mono { font-family: "Geist Mono", monospace; }
  #cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; transform-origin: 6px 4px; }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
<div id="frame">
  <div id="cam">
    <div id="shape">
      <!-- button -->
      <div class="layer" id="L_button"><span style="color:#fff;font-size:24px;font-weight:500;letter-spacing:-.01em;white-space:nowrap">Выбрать картинку</span></div>
      <!-- loader / check -->
      <div class="layer" id="L_loader"><svg width="44" height="44" viewBox="0 0 44 44"><circle id="arc" cx="22" cy="22" r="18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" pathLength="100"/></svg></div>
      <div class="layer" id="L_check"><svg width="44" height="44" viewBox="0 0 44 44"><path id="tick" d="M11 23l7 7 15-16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/></svg></div>
      <!-- island -->
      <div class="layer" id="L_island" style="width:360px;height:64px;justify-content:space-between;padding:0 14px 0 12px;box-sizing:border-box">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;border-radius:12px;background:#2A2A28;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 3v18M15 3v18M3 12h18"/></svg></div>
          <span style="color:#fff;font-size:19px;font-weight:500;white-space:nowrap">A1 · 9 частей</span>
        </div>
        <svg width="46" height="24" viewBox="0 0 46 24" id="wave"></svg>
      </div>
      <!-- player -->
      <div class="layer" id="L_player" style="width:520px;height:200px">
        <div style="position:absolute;left:28px;top:28px;width:144px;height:144px;border-radius:24px;background:#F4F3EF;overflow:hidden">
          <svg width="144" height="144" viewBox="0 0 144 144"><path d="M22 118 C50 100 70 70 122 30" fill="none" stroke="#3A2E22" stroke-width="3" stroke-linecap="round"/><path d="M52 98c-6-18 2-30 18-34-2 16-8 28-18 34z M78 72c-4-18 6-30 22-32-4 16-10 26-22 32z M62 84c16-8 32-4 40 8-16 4-30 2-40-8z M92 56c14-8 26-4 32 6-14 4-24 2-32-6z" fill="#8FB996" stroke="#23402B" stroke-width="2"/><circle cx="44" cy="92" r="6" fill="#C8553D"/><circle cx="54" cy="96" r="6" fill="#C8553D"/></svg>
        </div>
        <div style="position:absolute;left:196px;top:38px;color:#fff">
          <div style="font-size:24px;font-weight:600;letter-spacing:-.02em">Световой стол</div>
          <div style="font-size:17px;color:#9C9B95;margin-top:4px">Kalka · 120 BPM</div>
        </div>
        <div style="position:absolute;left:196px;top:124px;width:220px;height:6px;border-radius:3px;background:#3A3A37"><div id="prog" style="height:100%;border-radius:3px;background:#fff;width:20%"></div><div id="progKnob" style="position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff"></div></div>
        <div class="mono" style="position:absolute;left:196px;top:144px;width:220px;display:flex;justify-content:space-between;color:#9C9B95;font-size:13px"><span id="tcur">0:24</span><span>2:00</span></div>
        <div id="playBtn" style="position:absolute;left:442px;top:106px;width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 22 22"><path id="pp" fill="#111110"/></svg></div>
      </div>
      <!-- volume -->
      <div class="layer" id="L_volume" style="width:520px;height:64px">
        <div id="volFill" style="position:absolute;left:0;top:0;bottom:0;background:#111110;border-radius:32px"></div>
        <svg style="position:absolute;left:22px;top:20px" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="spk" d="M4 9h4l5-4v14l-5-4H4z" stroke="#fff"/></svg>
        <svg id="spkHi" style="position:absolute;right:22px;top:20px" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111110" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      </div>
      <!-- tabs -->
      <div class="layer" id="L_tabs" style="width:560px;height:80px">
        <div id="tabLabels" style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;font-size:24px;font-weight:500"></div>
      </div>
      <!-- chart -->
      <div class="layer" id="L_chart" style="width:620px;height:420px">
        <div style="position:absolute;left:36px;top:30px">
          <div style="font-size:15px;color:#8E8D87;font-weight:500;letter-spacing:.04em;text-transform:uppercase">Обведено · A1</div>
          <div style="font-size:40px;font-weight:600;letter-spacing:-.03em;margin-top:4px"><span id="chartBig">9</span> <span style="font-size:22px;color:#8E8D87;font-weight:500">частей за неделю</span></div>
        </div>
        <svg id="chart" style="position:absolute;left:36px;top:150px" width="548" height="230" viewBox="0 0 548 230"></svg>
        <div id="tip" style="position:absolute;left:0;top:0;padding:8px 12px;border-radius:12px;background:#111110;color:#fff;font-size:15px;font-weight:500;white-space:nowrap;transform:translate(-50%,-100%)"></div>
      </div>
      <!-- command palette -->
      <div class="layer" id="L_palette" style="width:600px;height:340px;align-items:flex-start">
        <div style="position:absolute;left:0;right:0;top:0;height:76px;border-bottom:1px solid rgba(17,17,16,.08);display:flex;align-items:center;gap:14px;padding:0 26px;box-sizing:border-box">
          <span class="mono" style="font-size:15px;padding:5px 8px;border-radius:8px;background:rgba(17,17,16,.07);color:#6B6A65">⌘K</span>
          <span id="query" style="font-size:24px;font-weight:500"></span><span id="caret" style="width:2px;height:28px;background:#111110;margin-left:-12px"></span>
        </div>
        <div id="items" style="position:absolute;left:12px;right:12px;top:88px"></div>
      </div>
      <!-- toast -->
      <div class="layer" id="L_toast" style="gap:14px"><span style="width:30px;height:30px;border-radius:50%;background:#E0102F;display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span style="color:#fff;font-size:22px;font-weight:500;white-space:nowrap">Лист A1 · 9 частей</span></div>
      <!-- toggle knob / tab indicator: one element across both states -->
      <div id="knob" style="position:absolute"></div>
    </div>
    <svg id="cursor" viewBox="0 0 40 40"><path d="M6 4 L6 31 L13 24.5 L18 35.5 L23 33.3 L18.2 22.6 L27.5 22.2 Z" fill="#111110" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
  </div>
</div>

<script type="module">
import { spring, fromApple } from '../js/spring.js';

/* ---------------- time ---------------- */
const BEATS = await fetch('beats.json').then((r) => r.json());
const P = BEATS.duration;                         // loop length, s
const B = (b) => {                                // beat number (fractional) → seconds, on the measured grid
  const i = Math.floor(b), f = b - i;
  const t0 = i < BEATS.beats.length ? BEATS.beats[i] : i * 0.5;
  return t0 + f * 0.5;
};

/* ---------------- springs ---------------- */
const SP = {
  morph: spring(fromApple(0.55, 0.08)),
  cam: spring(fromApple(0.75, 0)),
  fast: spring(fromApple(0.3, 0.1)),
  slow: spring(fromApple(0.5, 0.05)),
  ui: spring(fromApple(0.4, 0.06)),
  cursor: spring(fromApple(0.5, 0)),
  fade: spring(fromApple(0.28, 0)),
};
/**
 * A value that changes target at given times is the sum of one spring per change.
 * Periodic: the previous loop's springs are added too, so t = 0 and t = P are identical.
 * steps: [[beat, value, springName?]]; the value before the first step equals the last one.
 */
function track(steps, def = 'morph') {
  const s = steps.map(([b, v, sp]) => ({ t: B(b), v, p: SP[sp || def] }));
  const v0 = s.at(-1).v;
  let prev = v0;
  for (const x of s) { x.d = x.v - prev; prev = x.v; }
  return (t) => {
    let v = v0;
    for (const x of s) v += x.d * (x.p(t - x.t) + x.p(t - x.t + P) - 1);
    return v;
  };
}
/** Step function (for discrete things): value of the last step at or before t. */
function steps(list) {
  const s = list.map(([b, v]) => [B(b), v]);
  return (t) => { let v = s.at(-1)[1]; for (const [tt, vv] of s) if (t >= tt) v = vv; return v; };
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const mix = (a, b, k) => a + (b - a) * k;
const rgb = (c1, c2, k) => `rgb(${c1.map((c, i) => Math.round(mix(c, c2[i], k))).join(',')})`;
const BLACK = [17, 17, 16], WHITE = [255, 255, 255], RED = [224, 16, 47], TRACK = [214, 212, 205];

/* ---------------- the story, on the beat grid ----------------
   b0 button · b1 click → loader · b3 check · b4 island · b5 player · b6 play/pause
   b7.5–8.75 scrub · b9 volume · b10–12.25 drag past max · b14 toggle · b15 flip
   b16 tabs · b17, b18 liquid tab moves · b19 chart · b20 draws · b22–23 tooltip
   b24 ⌘K · b25 type · b26 enter → toast · b27.2 back to the button            */
const STATES = {
  button: { w: 300, h: 84, r: 42, dark: 1 }, loader: { w: 84, h: 84, r: 42, dark: 1 },
  island: { w: 360, h: 64, r: 32, dark: 1 }, player: { w: 520, h: 200, r: 40, dark: 1 },
  volume: { w: 520, h: 64, r: 32, dark: 0 }, toggle: { w: 168, h: 92, r: 46, dark: 0 },
  tabs: { w: 560, h: 80, r: 40, dark: 0 }, chart: { w: 620, h: 420, r: 36, dark: 0 },
  palette: { w: 600, h: 340, r: 28, dark: 0 }, toast: { w: 420, h: 72, r: 36, dark: 1 },
};
const SEQ = [[0, 'button'], [1.1, 'loader'], [4, 'island'], [5, 'player'], [9, 'volume'], [14, 'toggle'],
  [16, 'tabs'], [19, 'chart'], [24, 'palette'], [26.1, 'toast'], [27.2, 'button']];
const prop = (k) => track(SEQ.map(([b, s]) => [b, STATES[s][k]]));
const W = prop('w'), H = prop('h'), R = prop('r'), DARK = prop('dark');
const zoomFor = (s) => Math.min(5, 0.6 * 1440 / Math.max(STATES[s].w, STATES[s].h * 1.25));
const ZOOM = track(SEQ.map(([b, s]) => [b, zoomFor(s)]), 'cam');
const ACCENT = track([[0, 0], [15, 1, 'ui'], [16, 0, 'ui']]);                 // toggle on = red
const TOG = track([[0, 0], [14, 1, 'ui'], [16, 0, 'ui']]);                    // grey track while it is a toggle

/* layers: each has its own enter and exit so swapped text never overlaps (in beats) */
const LAYERS = {};
const VIS = {
  L_button: [[27.2, 1.1]], L_loader: [[1.1, 3]], L_check: [[3, 4]], L_island: [[4, 5]], L_player: [[5, 9]],
  L_volume: [[9, 14]], L_tabs: [[16, 19]], L_chart: [[19, 24]], L_palette: [[24, 26.1]], L_toast: [[26.1, 27.2]],
};
function visTrack([[a, b]]) {
  // wraps around the loop when b < a
  if (b > a) return track([[a + 0.1, 1, 'fade'], [b, 0, 'fade']]);
  return track([[b, 0, 'fade'], [a + 0.1, 1, 'fade']]);
}
for (const k in VIS) LAYERS[k] = visTrack(VIS[k]);

/* cursor: world coordinates (shape centre = 0,0), springs between targets */
const CUR = [
  [0, 250, 170], [0.25, 70, 12], [1.6, 150, 90],               // click the button
  [5.4, 218, 32],                                              // to play
  [7.0, -17, 27],                                              // to the progress knob
  [7.5, -17, 27, 'fast'], [8.75, 150, 27, 'slow'],             // scrub
  [9.1, 200, 70], [9.6, -78, 0],                               // the volume edge
  [10.0, -78, 0, 'fast'], [11.0, 260, 0, 'slow'], [12.2, 330, 0, 'slow'],
  [12.9, 150, 120], [14.4, 30, 10],                            // to the toggle
  [16.3, -70, 4], [17.4, 210, 4],                              // tabs A3, A1
  [19.3, 280, 240], [21.8, 20, 60], [22.9, 170, 20],           // chart hover
  [23.8, 320, 260], [27.0, 250, 170],                          // away, then home = start
];
const CX = track(CUR.map(([b, x, , sp]) => [b, x, sp || 'cursor'])), CY = track(CUR.map(([b, , y, sp]) => [b, y, sp || 'cursor']));
const PRESS = track([[1, 1, 'fast'], [1.2, 0, 'fast'], [6, 1, 'fast'], [6.2, 0, 'fast'], [7.5, 1, 'fast'], [8.75, 0, 'fast'],
  [10, 1, 'fast'], [12.25, 0, 'fast'], [15, 1, 'fast'], [15.2, 0, 'fast'], [17, 1, 'fast'], [17.2, 0, 'fast'], [18, 1, 'fast'], [18.2, 0, 'fast']]);

/* player */
const PP = track([[0, 0], [6, 1, 'ui'], [9, 0, 'ui']]);        // play ▶ → pause ❚❚ morph
const BAR_X0 = 196 - 260, BAR_W = 220;                         // progress bar in world coords (player centred)
function progress(t) {
  const tPlay = B(6), tDown = B(7.5), tUp = B(8.75), rate = 0.018;
  const scrub = (tt) => clamp((CX(tt) - BAR_X0) / BAR_W);
  if (t < tPlay) return 0.2;
  if (t < tDown) return 0.2 + rate * (t - tPlay);
  if (t < tUp) return scrub(t);
  return scrub(tUp) + rate * (t - tUp);
}
/* volume: direct manipulation, rubber band past max, springs back on release */
const VOL_X0 = -260, VOL_W = 520;
function volume(t) {
  const down = B(10), up = B(12.25);
  const raw = (tt) => (CX(tt) - VOL_X0) / VOL_W;
  const rubber = (over) => 70 * (1 - Math.exp(-over * VOL_W / 140));
  if (t < down) return { v: 0.35, s: 0 };
  if (t <= up) { const r = raw(t); return { v: clamp(r, 0.05, 1), s: r > 1 ? rubber(r - 1) : 0 }; }
  const r = raw(up), s0 = r > 1 ? rubber(r - 1) : 0;
  return { v: clamp(r, 0.05, 1), s: s0 * (1 - SP.slow(t - up)) };
}
/* toggle knob → tab indicator: two edges on different springs */
const TABS = ['A4', 'A3', 'A2', 'A1'], TAB_W = 560 / 4;
const KL = track([[14, 4], [15, 4, 'slow'], [15.02, 80, 'slow'], [16, 8], [17, 8 + TAB_W, 'slow'], [18, 8 + 3 * TAB_W, 'slow'], [19, 8 + 3 * TAB_W], [26, 4]]);
const KR = track([[14, 88], [15, 88, 'fast'], [15.02, 164, 'fast'], [16, TAB_W - 8], [17, 2 * TAB_W - 8, 'fast'], [18, 4 * TAB_W - 8, 'fast'], [19, 4 * TAB_W - 8], [26, 88]]);
const KNOB_VIS = track([[14.1, 1, 'fade'], [18.9, 0, 'fast']]);
const KNOB_DARK = track([[14, 0], [16, 1], [19, 1], [26, 0]]);

/* chart */
const PTS = [1, 0, 2, 1, 3, 2, 4].map((v, i) => [i * (548 / 6), 210 - v * 46]);
const DRAW = track([[0, 0], [20, 1, 'slow'], [24.2, 0, 'fade']]);
const HOVER = track([[0, 0], [21.8, 1, 'fade'], [23.8, 0, 'fade']]);
const CHART_X0 = -310 + 36;                                   // chart svg left in world coords

/* palette */
const ITEMS = ['Лист A4', 'Лист A3', 'Лист A2', 'Лист A1', 'Печать на A4'];
const QUERY = steps([[0, ''], [25, 'a'], [25.5, 'a1'], [27, '']]);
const ITEM_VIS = ITEMS.map((name) => track([[0, 1], [25.5, name === 'Лист A1' ? 1 : 0, 'ui'], [27, 1]]));
const ENTER = track([[0, 0], [26, 1, 'fast'], [26.2, 0, 'fast']]);

/* ---------------- render ---------------- */
const $ = (id) => document.getElementById(id);
const shape = $('shape'), cursor = $('cursor');
$('tabLabels').innerHTML = TABS.map((t, i) => `<span id="tab${i}" style="position:relative;z-index:1">${t}</span>`).join('');
function wave(t) {
  let s = '';
  for (let i = 0; i < 7; i++) {
    const h = 6 + 14 * Math.abs(Math.sin(t * 7 + i * 1.3)) * (0.5 + 0.5 * Math.sin(i));
    s += `<rect x="${i * 7}" y="${12 - h / 2}" width="4" height="${h}" rx="2" fill="#fff"/>`;
  }
  return s;
}

window.seek = function seek(t) {
  t = ((t % P) + P) % P;
  const vol = volume(t);
  const w = W(t) + vol.s * (LAYERS.L_volume(t)), h = H(t) - vol.s * 0.12 * LAYERS.L_volume(t);
  const z = Math.min(ZOOM(t), 1180 / Math.max(w, h)); // camera lags for feel, but never crops the shape
  const dark = clamp(DARK(t)), acc = clamp(ACCENT(t));
  const tog = clamp(TOG(t));
  const c = WHITE.map((v, i) => mix(mix(v, BLACK[i], dark), TRACK[i], tog * (1 - acc)));
  const bg = rgb(c, RED, acc * tog);
  const cam = $('cam');
  cam.style.transform = `scale(${z})`;
  Object.assign(shape.style, {
    width: w + 'px', height: h + 'px', left: -w / 2 + 'px', top: -h / 2 + 'px', borderRadius: R(t) + 'px', background: bg,
    boxShadow: `0 ${24 / z}px ${60 / z}px -${20 / z}px rgba(0,0,0,${0.18 + 0.1 * dark})`,
  });

  // layers: opacity + short blur while swapping
  for (const id in LAYERS) {
    const el = $(id), o = clamp(LAYERS[id](t));
    el.style.opacity = o;
    el.style.filter = o > 0.995 ? 'none' : `blur(${(1 - o) * 10}px)`;
    el.style.transform = `translate(-50%,-50%) scale(${0.96 + 0.04 * o})`;
    el.style.visibility = o < 0.003 ? 'hidden' : 'visible';
  }
  // loader & check
  const spin = (t - B(1.1)) * 540;
  $('arc').setAttribute('stroke-dasharray', `${mix(20, 70, 0.5 + 0.5 * Math.sin(t * 6))} 100`);
  $('arc').style.transformOrigin = '22px 22px';
  $('arc').style.transform = `rotate(${spin}deg)`;
  $('tick').setAttribute('stroke-dasharray', `${100 * clamp(SP.slow(t - B(3)))} 100`);
  $('wave').innerHTML = wave(t);

  // player
  const pp = clamp(PP(t)); // 0 = play triangle, 1 = pause bars; morph the same 8 points
  const lerp = (x, y) => mix(x, y, pp);
  const L1 = [lerp(6, 5), 3, lerp(6, 5), 19, lerp(13, 9), lerp(15, 19), lerp(13, 9), lerp(7, 3)];
  const L2 = [lerp(13, 13), lerp(7, 3), lerp(13, 13), lerp(15, 19), lerp(19, 17), lerp(11, 19), lerp(19, 17), lerp(11, 3)];
  $('pp').setAttribute('d', `M${L1[0]} ${L1[1]}L${L1[6]} ${L1[7]}L${L1[4]} ${L1[5]}L${L1[2]} ${L1[3]}Z M${L2[0]} ${L2[1]}L${L2[6]} ${L2[7]}L${L2[4]} ${L2[5]}L${L2[2]} ${L2[3]}Z`);
  const pr = progress(t);
  $('prog').style.width = pr * 100 + '%';
  $('progKnob').style.left = pr * 100 + '%';
  $('progKnob').style.transform = `scale(${1 + 0.35 * clamp(PRESS(t)) * (t > B(7.3) && t < B(9) ? 1 : 0)})`;
  const secs = Math.round(pr * 120);
  $('tcur').textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;

  // volume
  $('volFill').style.width = `calc(${vol.v * 100}% + ${vol.s}px)`;
  $('spk').setAttribute('stroke', vol.v > 0.08 ? '#fff' : '#111110');
  $('spkHi').setAttribute('stroke', vol.v > 0.94 ? '#fff' : '#111110');

  // knob / indicator
  const kv = clamp(KNOB_VIS(t)), kd = clamp(KNOB_DARK(t));
  const inset = mix(4, 8, kd), kl = KL(t), kr = KR(t);
  Object.assign($('knob').style, {
    left: kl + 'px', width: Math.max(0, kr - kl) + 'px', top: inset + 'px', bottom: inset + 'px',
    borderRadius: '999px', background: rgb(WHITE, BLACK, kd), opacity: kv,
    boxShadow: kd < 0.5 ? '0 2px 6px rgba(0,0,0,.18)' : 'none', visibility: kv < 0.003 ? 'hidden' : 'visible',
  });
  TABS.forEach((_, i) => {
    const el = $('tab' + i), mid = (i + 0.5) * TAB_W, on = mid > kl && mid < kr;
    el.style.color = on ? '#fff' : '#8E8D87';
  });
  $('L_tabs').style.zIndex = 2; // labels above the indicator

  // chart
  const dr = clamp(DRAW(t));
  let d = `M${PTS[0][0]} ${PTS[0][1]}`;
  for (let i = 1; i < PTS.length; i++) {
    const [x0, y0] = PTS[i - 1], [x1, y1] = PTS[i], mx = (x0 + x1) / 2;
    d += ` C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}`;
  }
  const hov = clamp(HOVER(t)), cxw = CX(t) - CHART_X0;
  const idx = Math.max(0, Math.min(PTS.length - 1, Math.round(cxw / (548 / 6))));
  let s = `<g stroke="rgba(17,17,16,.07)">${[0, 1, 2, 3, 4].map((k) => `<line x1="0" x2="548" y1="${210 - k * 46}" y2="${210 - k * 46}"/>`).join('')}</g>`;
  s += `<path d="${d}" fill="none" stroke="#111110" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="${dr * 100} 100"/>`;
  PTS.forEach(([x, y], i) => {
    const on = clamp((dr * 7 - i) * 1.2);
    const hi = i === idx ? hov : 0;
    s += `<circle cx="${x}" cy="${y}" r="${(5 + 3 * hi) * on}" fill="${hi > 0.5 ? '#E0102F' : '#111110'}" stroke="#fff" stroke-width="3"/>`;
  });
  s += `<line x1="${PTS[idx][0]}" x2="${PTS[idx][0]}" y1="0" y2="210" stroke="rgba(17,17,16,${0.25 * hov})" stroke-dasharray="3 5"/>`;
  $('chart').innerHTML = s;
  const tip = $('tip'), val = [1, 0, 2, 1, 3, 2, 4][idx];
  tip.textContent = `День ${idx + 1} · ${val} ${val === 1 ? 'часть' : val > 1 && val < 5 ? 'части' : 'частей'}`;
  tip.style.left = 36 + PTS[idx][0] + 'px';
  tip.style.top = 150 + PTS[idx][1] - 16 + 'px';
  tip.style.opacity = hov;
  $('chartBig').textContent = Math.round(9 * dr);

  // palette
  const q = QUERY(t);
  $('query').textContent = q;
  $('caret').style.opacity = (Math.floor(t * 2.5) % 2 === 0 || q) ? 1 : 0;
  let y = 0, html = '';
  ITEMS.forEach((name, i) => {
    const v = clamp(ITEM_VIS[i](t));
    const sel = name === 'Лист A1' && q.length === 2;
    html += `<div style="position:absolute;left:0;right:0;top:${y}px;height:${48 * v}px;opacity:${v};overflow:hidden;border-radius:12px;display:flex;align-items:center;padding:0 16px;font-size:20px;background:${sel ? `rgba(17,17,16,${0.07 + 0.1 * clamp(ENTER(t))})` : 'transparent'};transform:scale(${1 - 0.02 * (sel ? clamp(ENTER(t)) : 0)})">${name}</div>`;
    y += 50 * v;
  });
  $('items').innerHTML = html;

  // cursor: world → screen, constant size on screen
  const cx = CX(t) * z, cy = CY(t) * z, pr2 = clamp(PRESS(t));
  cursor.style.transform = `translate(${cx - 6}px, ${cy - 4}px) scale(${(1 - 0.14 * pr2) / z})`;
  cursor.style.transformOrigin = '6px 4px';
};

/* UI sounds, read by render.mjs: [seconds, kind] */
window.EVENTS = [
  [1, 'click'], [3, 'done'], [6, 'click'], [7.5, 'grab'], [8.75, 'drop'], [10, 'grab'], [12.25, 'drop'],
  [15, 'toggle'], [17, 'tick'], [18, 'tick'], [22, 'hover'], [23, 'hover'], [25, 'key'], [25.5, 'key'], [26, 'enter'], [26.1, 'toast'],
].map(([b, k]) => [B(b), k]);
window.DURATION = P;
await document.fonts.ready;
seek(Number(new URLSearchParams(location.search).get('t') || 0));
window.ready = true;
if (location.hash === '#play') {
  const t0 = performance.now();
  const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
