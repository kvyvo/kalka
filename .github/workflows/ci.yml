name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { browser: [chromium, webkit] } # webkit = Safari's engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # test exactly what gets deployed: the build with versioned module URLs
      - run: V=${GITHUB_SHA::8} npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: SITE=_site BROWSER=${{ matrix.browser }} npm run e2e
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v5
      - run: V=${GITHUB_SHA::8} npm run build
      - uses: actions/upload-pages-artifact@v3
      - id: d
        uses: actions/deploy-pages@v4
